<title>Dad's Coin Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+SC:wght@600&display=swap">
<style>
/* Layout: one column, coin-album feel. Navy album board, brass accents, big tap targets, 20px base type. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #141a2b;
  --muted: #4a5266;
  --line: #c9cedb;
  --album: #1d2c55; --money: #1a7a37;
  --album-ink: #ffffff;
  --brass: #9a6b12;
  --brass-soft: #f4e7c8;
  --danger: #a3241c;
  --danger-soft: #fbe4e1;
  --focus: #2457d6;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mark: "Cormorant SC", Georgia, "Times New Roman", serif;
  --step-0: 1.25rem;
  --step-1: 1.5rem;
  --step-2: 1.9rem;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #1a2136; --ink: #f2f3f7; --muted: #b9bfd0; --line: #39425c;
  --album: #2b3d70; --album-ink: #ffffff; --money: #7fd88a; --brass: #e2b65a; --brass-soft: #3a2f17;
  --danger: #ff8a7f; --danger-soft: #3d1c1a; --focus: #8fb0ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #1a2136; --ink: #f2f3f7; --muted: #b9bfd0; --line: #39425c;
  --album: #2b3d70; --album-ink: #ffffff; --money: #7fd88a; --brass: #e2b65a; --brass-soft: #3a2f17;
  --danger: #ff8a7f; --danger-soft: #3d1c1a; --focus: #8fb0ff; color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

.bar { background: var(--album); color: var(--album-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
.bar-in { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-height: 76px }
.bar h1 { font-family: var(--font-mark); font-weight: 600; font-size: 2rem; letter-spacing: .02em; margin: 0; flex: 1; min-width: 0; line-height: 1.1 }
@media (max-width: 380px) { .bar h1 { font-size: 1.6rem } }
.bar .back { background: transparent; color: var(--album-ink); border: 2px solid currentColor; border-radius: var(--radius); padding: 8px 16px; min-height: 56px; cursor: pointer; font-weight: 700 }
.bar .icon-btn { background: transparent; color: var(--album-ink); border: 2px solid transparent; border-radius: var(--radius); min-height: 56px; padding: 8px 12px; cursor: pointer; font-weight: 700 }

main { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; display: grid; gap: 20px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 12px 22px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-align: center }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--surface); font-size: var(--step-1) }
:root:not([data-theme="light"]) .btn.primary { color: #1a1406 }
:root[data-theme="light"] .btn.primary { color: #ffffff }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.primary { color: #ffffff } }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface) }
.btn.wide { width: 100% }
.btn:disabled { opacity: .35; cursor: default }
a.btn { text-decoration: none; color: inherit }
.btn svg { width: 30px; height: 30px; flex: none }
.row { display: flex; flex-wrap: wrap; gap: 12px }
.row > .btn { flex: 1 1 220px }

.search { display: flex; gap: 10px; align-items: center }
.search input { flex: 1; min-width: 0; min-height: 60px; padding: 10px 16px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.count { color: var(--muted); margin: 0 }

.note { background: var(--brass-soft); border: 2px solid var(--brass); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px }
.note p { margin: 0 }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start }
.card:hover { border-color: var(--brass) }
.card .ph { aspect-ratio: 1; max-width: 100%; border-radius: 50%; overflow: hidden; background: var(--bg); display: grid; place-items: center; border: 3px solid var(--line) }
.card .ph img { width: 100%; height: 100%; object-fit: cover }
.card .t { font-weight: 700; font-size: var(--step-0); line-height: 1.25 }
.card .s { color: var(--muted); font-size: 1.1rem }
.ph.stock, .ring.stock, .frame.stock { position: relative; border-style: dashed }
.ph.stock img, .ring.stock img, .frame.stock img { object-fit: contain; background: #fff }
.stockmark { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px 10%; background: rgba(20,26,43,.82); color: #fff; font-weight: 700; font-size: 1rem; text-align: center; line-height: 1.2 }
.frame .stockmark, .card .stockmark { padding-bottom: 6px; font-size: 1.3rem }
.card .stockmark { padding-bottom: 12% }
.tag { display: inline-block; background: var(--brass-soft); color: var(--ink); border: 1px solid var(--brass); border-radius: 999px; padding: 0 10px; font-size: 1rem; font-weight: 700 }

.empty { text-align: center; padding: 30px 10px; color: var(--muted) }

/* detail */
.photo-big { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 12px }
.photo-big .frame { aspect-ratio: 1; max-width: 100%; background: var(--bg); border-radius: 10px; overflow: hidden; display: grid; place-items: center; cursor: zoom-in }
.photo-big .frame img { width: 100%; height: 100%; object-fit: contain }
.seg { display: flex; gap: 8px; flex-wrap: wrap }
.seg button { flex: 1 1 120px; min-height: 56px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--album); color: var(--album-ink); border-color: var(--album) }
dl.facts { margin: 0; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 6px 16px }
dl.facts div { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
dl.facts div:last-child { border-bottom: 0 }
dl.facts dt { color: var(--muted); font-weight: 700 }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap }

.detail { display: grid; gap: 20px; align-items: start }
@media (min-width: 860px) { .detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } }
.detail > * { min-width: 0 }
/* form */
form { display: grid; gap: 18px }
.field { display: grid; gap: 6px }
.field label { font-weight: 700 }
.field label .hint { font-weight: 400 }
.field .hint { color: var(--muted); font-size: 1.05rem }
.field input, .field select, .field textarea { width: 100%; min-height: 60px; padding: 10px 14px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.field textarea { min-height: 120px; resize: vertical }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 18px }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.slot { background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; text-align: center }
.slot .ph { aspect-ratio: 1; max-width: 100%; border-radius: 50%; overflow: hidden; background: var(--bg); display: grid; place-items: center; color: var(--muted) }
.slot .ph img { width: 100%; height: 100%; object-fit: cover }
/* Keep the photo circles small enough that both buttons fit on the first screen, even on a wide computer screen. */
.slot .ph { width: min(100%, 24vh); margin: 0 auto }
/* Floating "Add info below" / "Top" button on the Add a coin page. */
.jump { position: fixed; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--album); color: var(--album-ink); border: 2px solid var(--album-ink);
  border-radius: 999px; min-height: 56px; padding: 8px 20px; font: inherit; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3) }
.jump b { font-size: 1.5rem; line-height: 1 }
#f { padding-bottom: 72px }
.slot .btn { min-height: 56px; padding: 8px 10px; font-size: 1.1rem }

/* import review */
.ask { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px }
.ask p { margin: 0; font-weight: 700 }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 760px) { .rgrid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.rtile { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 8px; display: grid; gap: 8px; align-content: start }
.rtile.front { border-color: var(--album) }
.rtile.back { border-color: var(--brass); border-style: dashed }
.rtile .ph { aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--bg); padding: 0; border: 0; cursor: zoom-in; display: block; width: 100% }
.rtile .ph img { width: 100%; height: 100%; object-fit: cover; display: block }
.rtile .lab { font-weight: 700; text-align: center; line-height: 1.2 }
.rtile .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 1rem }
.arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.arrows button { min-height: 56px; border-radius: var(--radius); border: 2px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 1.6rem; cursor: pointer; line-height: 1 }
.arrows button:disabled { opacity: .3; cursor: default }
.pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.pager .btn { flex: 1 1 140px }
.pager .where { flex: 1 1 100%; text-align: center; color: var(--muted); font-weight: 700; order: -1 }

/* zoom viewer */
.viewer { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: 1fr auto }
.viewer .stage { overflow: hidden; touch-action: none; position: relative }
.viewer .stage img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center; user-select: none; -webkit-user-drag: none }
.viewer .tools { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: #111; flex-wrap: wrap }
.viewer .tools .btn { flex: 1 1 100px; background: #222; color: #fff; border-color: #555 }

/* confirm sheet + toast */
/* The dimmed layer itself scrolls, so a tall popup can always be scrolled (wheel, touch or keyboard) on any screen. */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: flex; flex-direction: column; align-items: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain }
.sheet { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 20px; width: min(560px, 100%); display: grid; gap: 16px; margin-top: auto; flex: none }
@media (min-width: 700px) { .sheet { margin-block: auto } }
.sheet h2 { margin: 0; font-size: var(--step-1) }
.sheet p { margin: 0 }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 560px; background: var(--album); color: var(--album-ink); padding: 16px 20px; border-radius: var(--radius); font-weight: 700; z-index: 40; text-align: center }
h2.sec { font-size: var(--step-1); margin: 8px 0 0 }
.help p { margin: 0 0 10px }
.help ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px }
.busy { color: var(--muted); font-weight: 700 }
.btn.choice { font-size: var(--step-0); justify-content: flex-start; text-align: left; gap: 16px; padding: 16px 20px }
.btn.choice svg { width: 40px; height: 40px }
.btn.choice small { font-size: 1.05rem; font-weight: 400 }
.sync-code { font-size: 3.4rem; font-weight: 700; letter-spacing: .12em; text-align: center; background: var(--surface); border: 3px solid var(--brass); border-radius: var(--radius); padding: 18px 10px; font-variant-numeric: tabular-nums }
/* albums */
.albs { display: grid; gap: 12px }
[hidden] { display: none !important }
.alb { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: left; cursor: pointer; display: grid; gap: 6px; min-height: 64px }
.alb:hover { border-color: var(--brass) }
.alb { grid-template-columns: 56px 1fr; align-items: center; column-gap: 14px }
.alb-b { display: grid; gap: 6px; min-width: 0 }
.alb-t { font-weight: 700 }
.alb-s { color: var(--muted); font-size: 1.1rem }
.prog { height: 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden }
.prog span { display: block; height: 100%; background: var(--brass) }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 128px), 1fr)); gap: 14px; background: var(--album); padding: 16px; border-radius: var(--radius) }
.slotc { background: transparent; border: 0; color: var(--album-ink); cursor: pointer; display: grid; gap: 6px; justify-items: center; align-content: start; padding: 4px; border-radius: 10px; text-align: center }
.slotc .ring { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(255,255,255,.55); background: rgba(0,0,0,.28); display: grid; place-items: center; overflow: hidden; font-size: 2rem; color: rgba(255,255,255,.7) }
.slotc.has .ring { border: 3px solid var(--brass); background: #000 }
.slotc .ring img { width: 100%; height: 100%; object-fit: cover }
.slotc .lab { font-weight: 700; font-size: 1.1rem; line-height: 1.2 }
.slotc .s { font-size: 1rem; opacity: .85 }
.slotc .pr { font-size: 1.05rem; font-weight: 700 }
.slotc.t1 .ring { border-color: var(--t1) } .slotc.t2 .ring { border-color: var(--t2) } .slotc.t3 .ring { border-color: var(--t3) } .slotc.t4 .ring { border-color: var(--t4) }
.slotc.t1:not(.has) .ring { background: color-mix(in srgb, var(--t1) 30%, transparent) } .slotc.t2:not(.has) .ring { background: color-mix(in srgb, var(--t2) 30%, transparent) }
.slotc.t3:not(.has) .ring { background: color-mix(in srgb, var(--t3) 30%, transparent) } .slotc.t4:not(.has) .ring { background: color-mix(in srgb, var(--t4) 35%, transparent) }
.slotc[class*=" t"] .ring { border-width: 5px }
.slotc.t1 .pr { color: var(--t1) } .slotc.t2 .pr { color: var(--t2) } .slotc.t3 .pr { color: var(--t3) } .slotc.t4 .pr { color: var(--t4) }
.aprice { background: var(--album); color: var(--album-ink); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; --t1: #7fd88a; --t2: #6cc0ff; --t3: #d3a6ff; --t4: #ffd34d }
.album-grid { --t1: #7fd88a; --t2: #6cc0ff; --t3: #d3a6ff; --t4: #ffd34d }
.aprice h2 { margin: 0; font-size: var(--step-1) }
.worth-s { font-weight: 800; color: var(--money); letter-spacing: 1px; white-space: nowrap; margin-left: 4px }
.worth-s .dim { opacity: .22 }
.worth-s.pending { color: var(--muted) }
.alb-w { display: block; font-size: 1.2rem; line-height: 1.2 }
.alb-w .worth-s { margin-left: 0 }
.signs-key ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1.1rem }
.signs-key li .worth-s { margin: 0 4px 0 0; font-size: 1.2rem }
.aprice .when { font-size: var(--step-0) }
.aprice p { margin: 0; font-size: 1.15rem }
.aprice .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; list-style: none; margin: 0; padding: 0; font-size: 1.15rem; font-weight: 700 }
.aprice .legend li { display: flex; align-items: center; gap: 8px }
.aprice .dot { width: 26px; height: 26px; border-radius: 50%; border: 4px solid rgba(255,255,255,.55); flex: none }
.aprice .top { font-size: var(--step-0); background: rgba(255,255,255,.1); border-radius: 10px; padding: 10px 12px }
.slotc.focus { outline: 4px solid var(--brass); outline-offset: 2px }
/* judging */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.pair figure { margin: 0; display: grid; gap: 6px; align-content: start }
.pair .frame { aspect-ratio: 1; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; cursor: zoom-in }
.pair .frame img { width: 100%; height: 100%; object-fit: contain; background: #000 }
.pair figcaption { font-weight: 700; font-size: 1.05rem; line-height: 1.3 }
.pair .pcgs-box { cursor: pointer; text-decoration: none; color: var(--ink); background: var(--brass-soft); border-color: var(--brass); display: grid; align-content: center; gap: 8px; padding: 10px; text-align: center }
.pair .pcgs-box strong { font-size: 1.15rem; line-height: 1.25 }
.pair .pcgs-box span { font-size: .95rem; color: var(--muted); line-height: 1.3 }
.busy.pad { padding: 10px; text-align: center; font-size: 1rem; font-weight: 400 }
.gradecard { background: var(--surface); border: 2px solid var(--brass); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px }
.gradecard h2 { margin: 0; font-size: var(--step-2); font-family: var(--font-mark) }
.gradecard p { margin: 0 }
.gradecard .hint, .g-step { color: var(--muted) }
.btn:disabled { opacity: .45; cursor: default }
/* insurance report */
.report { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px }
.rep-head h2 { margin: 0 0 4px; font-size: var(--step-1) }
.rep-head p { margin: 0 }
.rep-tot { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 10px 0 0 }
.rep-tot dt { color: var(--muted); font-size: 1rem }
.rep-tot dd { margin: 0; font-weight: 700; font-size: var(--step-1) }
.rep-item { border-top: 2px solid var(--line); padding-top: 12px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); break-inside: avoid; page-break-inside: avoid }
@media (min-width: 640px) { .rep-item { grid-template-columns: 260px minmax(0, 1fr) } .rep-item.nophoto { grid-template-columns: minmax(0, 1fr) } .rep-item h3 { grid-column: 1 / -1 } }
.rep-item h3 { margin: 0; font-size: var(--step-0) }
.rep-ph { display: flex; gap: 10px }
.rep-ph figure { margin: 0; flex: 1; max-width: 125px; text-align: center; font-size: .95rem; color: var(--muted) }
.rep-ph img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 1px solid var(--line) }
.rep-item dl { margin: 0; display: grid; gap: 2px }
.rep-item dl div { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 10px }
.rep-item dt { color: var(--muted) }
.rep-item dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap }
.rep-foot { color: var(--muted); font-size: 1rem; margin: 0; border-top: 2px solid var(--line); padding-top: 10px }
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] { --bg: #fff; --surface: #fff; --ink: #000; --muted: #444; --line: #bbb; color-scheme: light }
  body { font-size: 12pt }
  .bar, .no-print, .toast, .sheet-bg { display: none !important }
  main { padding: 0; max-width: none }
  .report { border: 0; padding: 0 }
  .rep-item { grid-template-columns: auto minmax(0, 1fr) } .rep-item.nophoto { grid-template-columns: minmax(0, 1fr) } .rep-item h3 { grid-column: 1 / -1 }
  .rep-ph figure { width: 1.2in; flex: none }
}
/* collection value */
.worth { background: var(--surface); border: 2px solid var(--brass); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; text-align: left; cursor: pointer; width: 100% }
.worth .k { color: var(--muted); font-weight: 700 }
.worth .v { font-size: var(--step-2); font-weight: 700; line-height: 1.2 }
.worth .s { color: var(--muted) }
.vlist { display: grid; gap: 10px }
.vrow { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 14px; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; cursor: pointer; min-height: 84px; width: 100% }
.vrow:hover { border-color: var(--brass) }
.vrow .ph { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--bg); border: 2px solid var(--line) }
.vrow .ph img { width: 100%; height: 100%; object-fit: cover }
.vrow .t { font-weight: 700; line-height: 1.25 }
.vrow .s { color: var(--muted); font-size: 1.05rem }
.vrow .amt { font-weight: 700; font-size: var(--step-1); white-space: nowrap }
.vrow .amt.none { color: var(--brass); font-size: var(--step-0) }
.sheet .field input { width: 100%; min-height: 64px; padding: 10px 14px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: var(--step-1) }
.sheet .field { display: grid; gap: 6px }
.sheet .field label { font-weight: 700 }
/* in-app price lookup */
.lk { border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; background: var(--surface) }

      el.innerHTML = `<div class="lk"><p>${esc(lookupError(e))}</p><button class="btn primary" type="button" data-k>Update the price key</button></div>`;
      el.querySelector("[data-k]").onclick = fixKey;

      el.querySelector("[data-r]").onclick = () => showLookup(el, c, onUse);
    }
    return e.message;
  }
  if (!r.found) { el.innerHTML = `<div class="lk"><p>${esc(r.why)}</p></div>`; return; }
  const mine = nGradeOf(c.grade), pick = r.prices.find((x) => x.grade === mine);
  const label = (g) => (NGRADES.find((x) => x[0] === g) || [g, g])[1];
  el.innerHTML = `<div class="lk">
    <div class="lk-head">${r.thumb ? `<img alt="" src="${esc(r.thumb)}" referrerpolicy="no-referrer">` : '<span></span>'}
      <div><div class="t">${esc(r.title)}</div><div class="s">${esc(r.issue || "")}${r.issue ? " · " : ""}<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">N# ${esc(r.id)}</a></div></div></div>
    ${r.prices.length ? `<div class="chips">${r.prices.map((x) => onUse
      ? `<button type="button" class="chip${x.grade === mine ? " mine" : ""}" data-p="${esc(cleanMoney(x.price))}" aria-label="Use ${esc(label(x.grade))} price ${dollars(+x.price)}">${esc(label(x.grade))} ${dollars(+x.price)}</button>`
      : `<span class="chip${x.grade === mine ? " mine" : ""}">${esc(label(x.grade))} ${dollars(+x.price)}</span>`).join("")}</div>
      ${onUse ? "<p class=\"count\">Tap a price to use it.</p>" : ""}`
      : `<p>Numista has no price estimates for ${r.issue ? "this date and mint mark" : "this exact date and mint mark"} yet.</p>`}
    ${pick ? `<div class="lk-use"><span>${c.grade ? `For ${esc(c.grade.split(" ")[0])}: ` : ""}about <strong>${dollars(+pick.price)}</strong></span>${onUse ? `<button class="btn small primary" type="button" data-use>Use ${dollars(+pick.price)}</button>` : ""}</div>`
      : r.prices.length && !c.grade ? "<p>Pick the condition to see the price for your coin.</p>" : ""}
    <p class="src">Source: Numista price estimates. Prices change, so treat these as a guide.</p>
  </div>`;
  const u = el.querySelector("[data-use]"); if (u) u.onclick = () => onUse(cleanMoney(pick.price));
  el.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => onUse(b.dataset.p));
}

// The full grading scale (Sheldon 1 to 70), the same steps PCGS Photograde uses. [grade, description, family]
// The labels of the original 13 grades are unchanged so coins saved earlier still match.
const SCALE = [
  ["P-1 Poor", 0], ["FR-2 Fair", 1], ["AG-3 About Good", 2],
  ["G-4 Good", 3], ["G-6 Good", 3],
  ["VG-8 Very Good", 4], ["VG-10 Very Good", 4],
  ["F-12 Fine", 5], ["F-15 Fine", 5],
  ["VF-20 Very Fine", 6], ["VF-25 Very Fine", 6], ["VF-30 Very Fine", 6], ["VF-35 Very Fine", 6],
  ["EF-40 Extremely Fine", 7], ["EF-45 Extremely Fine", 7],
  ["AU-50 About Uncirculated", 8], ["AU-53 About Uncirculated", 8], ["AU-55 About Uncirculated", 8], ["AU-58 About Uncirculated", 8],
  ["MS-60 Uncirculated", 9], ["MS-61 Uncirculated", 9], ["MS-62 Uncirculated", 9], ["MS-63 Uncirculated", 10], ["MS-64 Uncirculated", 10],
  ["MS-65 Gem Uncirculated", 11], ["MS-66 Gem Uncirculated", 11], ["MS-67 Superb Gem", 12], ["MS-68 Superb Gem", 12], ["MS-69 Superb Gem", 12],
  ["MS-70 Perfect", 13],
];
const GRADE_GROUPS = [["Poor, Fair and About Good", /^(P|FR|AG)-/], ["Good (G)", /^G-/], ["Very Good (VG)", /^VG-/], ["Fine (F)", /^F-/], ["Very Fine (VF)", /^VF-/],
  ["Extremely Fine (EF)", /^EF-/], ["About Uncirculated (AU)", /^AU-/], ["Uncirculated (MS)", /^MS-/]];
const GRADES = ["", ...SCALE.map((x) => x[0]), "PR Proof", "Not sure"];
function gradeSelect(cur) {
  cur = cur || "";
  const opt = (g) => `<option ${g === cur ? "selected" : ""} value="${esc(g)}">${esc(g) || "Choose…"}</option>`;
  const wear = SCALE.map((x) => x[0]);
  const other = ["PR Proof", "Not sure", ...(cur && !GRADES.includes(cur) ? [cur] : [])];
  return opt("") + GRADE_GROUPS.map(([label, re]) => `<optgroup label="${label}">${wear.filter((g) => re.test(g)).map(opt).join("")}</optgroup>`).join("")
    + `<optgroup label="Other">${other.map(opt).join("")}</optgroup>`;
}

const TCACHE = "coin-thumbs-2", thumbURLs = new Map();
async function typeThumb(id) {
  if (thumbURLs.has(id)) return thumbURLs.get(id);
  const job = (async () => {
    const key = "https://coin-thumbs.local/" + id;
    let cache = null; try { cache = await caches.open(TCACHE); } catch (e) {}
    const hit = cache && (await cache.match(key));
    if (hit) return URL.createObjectURL(await hit.blob());
    try { caches.delete("coin-thumbs-1"); } catch (e) {} // older pictures, some of the wrong years
    const s = seriesById(id);
    for (const t of [].concat(WIKI[id] || [])) {
      try {
        // An article's main picture can be today's design (the Jefferson nickel shows a 2006 one), so first
        // look through the article's pictures for one whose name or caption has a year from this series.
        let src = s ? await pictureFromYears(t, s.from, s.to || new Date().getFullYear()) : "";
        if (!src) {
          const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t));
          if (!r.ok) continue;
          const j = await r.json(); src = j.thumbnail && j.thumbnail.source;
        }
        if (!src) continue;
        const img = await fetch(src); if (!img.ok) continue;
        const blob = await img.blob();
        if (cache) cache.put(key, new Response(blob, { headers: { "content-type": blob.type } })).catch(() => {});
        return URL.createObjectURL(blob);
      } catch (e) { /* offline or blocked: no picture */ }
    }
    return "";
  })();
  thumbURLs.set(id, job);
  const u = await job; if (!u) thumbURLs.delete(id); // try again next time
  return u;
}
// The first picture in a Wikipedia article whose file name or caption mentions a year from..to,
// preferring the front of the coin. Returns its address, or "" when there is none.
async function pictureFromYears(title, from, to) {
  const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/" + encodeURIComponent(title));
  if (!r.ok) return "";
  const items = ((await r.json()).items || []).filter((x) => x.type === "image" && x.srcset && x.srcset.length);
  const score = (x) => {
    const text = (x.title || "") + " " + ((x.caption && x.caption.text) || "");
    const years = (text.match(/\b(1[789]\d\d|20\d\d)\b/g) || []).map(Number);
    if (!years.some((y) => y >= from && y <= to) || years.some((y) => y < from || y > to)) return 0;
    if (/reverse|monticello|eagle|building|portrait of|photograph of|designer/i.test(text) && !/obverse/i.test(text)) return 1;
    return /obverse|front/i.test(text) ? 3 : 2;
  };
  let best = null, bestScore = 0;
  for (const x of items) { const sc = score(x); if (sc > bestScore) { best = x; bestScore = sc; } }
  if (!best) return "";
  const src = best.srcset[0].src;
  return src.startsWith("//") ? "https:" + src : src;
}

    app.querySelectorAll(".alb").forEach((b) => {
      const s = seriesById(b.dataset.id), text = seriesText(s);
      const ok = words.every((w) => /^\d{4}$/.test(w) ? +w >= s.from && +w <= (s.to || 9999) : text.includes(w));
      b.hidden = !ok; any = any || ok;
    });
    app.querySelectorAll(".albsec").forEach((sec) => { sec.hidden = ![...sec.querySelectorAll(".alb")].some((b) => !b.hidden); });
    document.getElementById("aq-none").hidden = any;
  };
  app.querySelectorAll(".alb").forEach((b) => b.onclick = () => go({ name: "album", id: b.dataset.id }));

}

/* Top prices for an album: the highest Numista estimate (best condition) for each spot.
   Looked up on their own in the background, a little at a time, and saved on this device as each one
   arrives (Numista's terms allow storing for a personal project). Sync copies them to the other device. */
const albumPrices = new Map(); // series id -> { prices: Map(slot key -> number | null), running, error, done, date }
const APKEY = "coin-catalog-album-prices";
function savedAlbumPrices() { try { return JSON.parse(localStorage.getItem(APKEY) || "{}") || {}; } catch (e) { return {}; } }
function albumState(id) {
  if (!albumPrices.has(id)) {
    const sv = savedAlbumPrices()[id];
    if (sv && sv.prices) albumPrices.set(id, { prices: new Map(Object.entries(sv.prices)), running: false, error: "", done: 0, date: sv.date });
  }
  return albumPrices.get(id);
}
function saveAlbumPrices(id, st) {
  try { const all = savedAlbumPrices(); all[id] = { date: st.date, prices: Object.fromEntries(st.prices) }; localStorage.setItem(APKEY, JSON.stringify(all)); } catch (e) {}
}
// Adds prices from the other device: dates this device has no price for, or the other device's newer ones.
function mergeAlbumPrices(inc) {
  if (!inc || typeof inc !== "object") return 0;
  const all = savedAlbumPrices(); let n = 0;
  for (const [id, a] of Object.entries(inc)) {
    if (!seriesById(id) || !a || !a.prices || (albumPrices.get(id) || {}).running) continue;
    const mine = all[id] || { date: 0, prices: {} }, newer = (a.date || 0) > (mine.date || 0);
    for (const [k, v] of Object.entries(a.prices)) {
      if (v !== null && typeof v !== "number") continue;
      if (!(k in mine.prices) || (mine.prices[k] === null && v !== null) || (newer && v !== null && mine.prices[k] !== v)) { mine.prices[k] = v; n++; }
    }
    mine.date = Math.max(mine.date || 0, a.date || 0);
    all[id] = mine; albumPrices.delete(id);
  }
  try { localStorage.setItem(APKEY, JSON.stringify(all)); } catch (e) {}
  return n;
}
const albumDone = (s) => { const st = albumState(s.id); return !!st && slotsOf(s).every((z) => st.prices.has(z.key)); };
// Lookups used this month on this device. The free Numista plan allows 2,000 a month; the background
// lookups stop at 1,500 so there are always some left for checking single coins.
const NUSE = "coin-catalog-numista-use", BG_BUDGET = 1500;
const monthNow = () => new Date().toISOString().slice(0, 7);
function lookupsUsed() { try { const u = JSON.parse(localStorage.getItem(NUSE) || "{}"); return u.m === monthNow() ? u.n || 0 : 0; } catch (e) { return 0; } }
function countLookup() { try { localStorage.setItem(NUSE, JSON.stringify({ m: monthNow(), n: lookupsUsed() + 1 })); } catch (e) {} }
const TIERS = [[10000, 4, "$10,000 and up"], [1000, 3, "$1,000 to $9,999"], [100, 2, "$100 to $999"], [10, 1, "$10 to $99"], [0, 0, "Under $10"]];
const tierOf = (v) => TIERS.find((t) => v >= t[0])[1];
// Looks up the album's dates that have no saved answer yet (every date when `again`).
async function loadAlbumPrices(s, again = false) {
  const cur = albumState(s.id);
  if (cur && cur.running) return cur.error;
  // Saved prices stay showing while new ones come in.
  const st = { prices: new Map(cur ? cur.prices : []), running: true, error: "", done: 0, date: cur && cur.date };
  albumPrices.set(s.id, st);
  const step = () => { paintPrices(s); refreshSigns(s); };
  const get = (path, params) => { if (!again && lookupsUsed() >= BG_BUDGET) throw new Error("budget"); countLookup(); return nGet(path, params); };
  const keep = (k, v) => { if (v !== null || !st.prices.has(k) || st.prices.get(k) === null) st.prices.set(k, v); st.date = Date.now(); saveAlbumPrices(s.id, st); };
  try {
    const todo = slotsOf(s).filter((z) => again || !st.prices.has(z.key));
    if (todo.length) {
      const clean = (x) => String(x || "").replace(/[“”"]/g, "").replace(/\s*\(.*?\)/g, "").trim();
      const tries = [...new Set([clean(s.den), clean(s.name), clean(s.den).split(" ")[0]].filter((x) => x && x.length > 2))];
      let types = [];
      for (const q of tries) {
        const res = await get("/types", { q, category: "coin", lang: "en", count: 25 });
        types = ((res && res.types) || []).filter((t) => /united states|etats-unis|usa/i.test((t.issuer && (t.issuer.name || t.issuer.code)) || "") && !(t.min_year > (s.to || 9999) || t.max_year < s.from));
        if (types.length) break;
      }
      if (!types.length) { for (const z of todo) keep(z.key, null); throw new Error("notfound"); } // don't ask again
      // Some designs are split into several Numista types (like the silver war nickels), so gather the dates of each.
      const issues = [];
      for (const t of types.slice(0, 4)) {
        const r = (await get("/types/" + t.id + "/issues", { lang: "en" })) || [];
        for (const i of (Array.isArray(r) ? r : (r.issues || []))) issues.push({ t: t.id, i });
      }
      const queue = todo.map((z) => ({ z, m: issues.filter(({ i }) => String(i.year || i.gregorian_year) === z.year && normMint(i.mint_letter || "") === z.mint) }));
      const one = async ({ z, m }) => {
        // Use the best-matching coin only (Numista's search order, as the single-coin lookup does), so a
        // different coin of the same year, like the rarer three-cent silver of 1865, isn't mixed in.
        // The next match is tried only when the first has no prices.
        let top = null;
        for (const { t, i } of m) {
          const pr = await get("/types/" + t + "/issues/" + i.id + "/prices", { currency: "USD" });
          for (const x of (pr && pr.prices) || []) if (x && x.price != null && (top === null || +x.price > top)) top = +x.price;
          if (top !== null) break;
        }
        keep(z.key, top); st.done++; step();
      };
      const work = async () => { while (queue.length && !st.error) await one(queue.shift()); };
      await Promise.all([work(), work()]).catch((e) => { st.error = e.message; });
    }
  } catch (e) { st.error = e.message; }
  st.running = false; step();
  return st.error;
}
// 1 to 5 dollar signs for the albums list, from the album's most valuable date (the same bands as the colors).
function worthSigns(s) {
  const st = albumState(s.id); let top = null;
  if (st) for (const v of st.prices.values()) if (v != null && (top === null || v > top)) top = v;
  if (top === null) return '<span class="worth-s pending" role="img" aria-label="No prices yet">$?</span>';
  const n = tierOf(top) + 1;
  return `<span class="worth-s" role="img" aria-label="Most valuable date up to ${dollars(top)}">${"$".repeat(n)}<span class="dim" aria-hidden="true">${"$".repeat(5 - n)}</span></span>`;
}
// Keeps the dollar signs on the albums list up to date while prices come in.
function refreshSigns(s) {
  if (view.name !== "albums") return;
  app.querySelectorAll(`.alb[data-id="${s.id}"] .alb-w`).forEach((el) => { el.innerHTML = worthSigns(s); });
}
// Goes through every album on its own, the ones Dad has started first, until all have prices or the
// month's lookups run out. Runs whenever the app opens with a price key, and picks up where it left off.
let bgPrices = false;
async function backgroundPrices() {
  if (bgPrices || !numistaKey()) return;
  bgPrices = true;
  try {
    const list = SERIES.filter((s) => slotsOf(s).length);
    const order = [...list.filter((s) => albumFill(s).size), ...list.filter((s) => !albumFill(s).size)];
    for (const s of order) {
      if (albumDone(s)) continue;
      const err = await loadAlbumPrices(s);
      if (err && err !== "notfound") break; // no key, limit, offline: try again next time
    }
  } finally { bgPrices = false; }
}
// The price box above the album, and the colors and "up to $" on each circle.
function paintPrices(s) {
  const box = document.getElementById("aprice"); if (!box || view.name !== "album" || view.id !== s.id) return;
  const st = albumState(s.id), n = slotsOf(s).length;
  app.querySelectorAll(".slotc").forEach((b) => {
    const v = st ? st.prices.get(b.dataset.k) : null;
    b.classList.remove("t1", "t2", "t3", "t4");
    const pr = b.querySelector(".pr"); if (pr) pr.remove();
    if (v == null) return;
    const t = tierOf(v); if (t) b.classList.add("t" + t);
    b.querySelector(".lab").insertAdjacentHTML("afterend", `<span class="pr">Up to ${dollars(v)}</span>`);
  });
  const legend = `<ul class="legend">${TIERS.slice().reverse().map(([, t, lab]) => `<li><span class="dot" style="${t ? `border-color:var(--t${t});background:color-mix(in srgb, var(--t${t}) 35%, transparent)` : ""}"></span>${lab}</li>`).join("")}</ul>`;
  if (!numistaKey() && !(st && st.prices.size)) {
    box.innerHTML = `<h2>What could these coins be worth?</h2>
      <p>Once price lookups are set up, the circles are colored by the highest price each date reaches in the best condition.</p>
      <button class="btn primary" type="button" id="ap-key">Set up price lookups</button>`;
    document.getElementById("ap-key").onclick = () => go({ name: "help", focus: "prices" });
    return;
  }
  let best = null; if (st) for (const [k, v] of st.prices) if (v != null && (!best || v > best[1])) best = [k, v];
  const known = st ? [...st.prices.values()].filter((v) => v != null).length : 0;
  const asked = st ? slotsOf(s).filter((z) => st.prices.has(z.key)).length : 0;
  const err = st && !st.running ? st.error : "";
  const status = st && st.running ? `Looking up prices… ${asked} of ${n} dates done.`
    : err === "notfound" ? "Numista doesn’t list this kind of coin, so the album isn’t colored."
    : err === "budget" || err === "limit" ? `${asked} of ${n} dates done. The rest are looked up next month, when the free Numista lookups start again.`
    : err === "key" ? "Numista didn’t accept the price key."
    : err ? `${asked} of ${n} dates done. The rest are looked up the next time the app is open and online.`
    : asked < n ? `${asked} of ${n} dates done. The rest are being looked up.`
    : `Prices found for ${known} of ${n} dates.${known < n ? " Dates without a price are left plain." : ""}`;
  box.innerHTML = `<h2>Top price for each date</h2>
    ${st && st.date ? `<p class="when">Prices as of <strong>${longDate(st.date)}</strong></p>` : ""}
    ${known ? `<p>Each circle is colored by the highest price that date reaches in the best condition. Most coins in average condition are worth much less.</p>${legend}` : ""}
    ${best ? `<div class="top">Most valuable here: <strong>${esc(best[0])}</strong>, up to <strong>${dollars(best[1])}</strong></div>` : ""}
    <p>${esc(status)} Source: Numista price estimates, a guide only.</p>
    ${err === "key" ? '<button class="btn" type="button" id="ap-fix">Update the price key</button>' : ""}
    ${st && !st.running && asked === n && numistaKey() ? `<button class="btn" type="button" id="ap-go">Update these prices now</button><p>Uses about ${n} of the ${(2000).toLocaleString()} free Numista lookups each month.</p>` : ""}`;
  const f = document.getElementById("ap-fix"); if (f) f.onclick = fixKey;
  const g = document.getElementById("ap-go"); if (g) g.onclick = () => loadAlbumPrices(s, true);
}

/* ---------- judging the condition ---------- */
const LADDER = SCALE.map((x) => x[0]); // P-1 Poor … MS-70 Perfect, most worn first
const TIER = ["", "", "", "g", "vg", "f", "vf", "ef", "au", "ms", "ms", "ms", "ms", "ms"];
const GRADE_TEXT = [
  "So worn the type of coin is barely recognizable. The date may be gone.",
  "Worn nearly smooth. You can tell what kind of coin it is and read part of the date.",
  "Very heavy wear. The letters are worn into the rim. The date can just be read.",
  "Heavily worn. The design is mostly an outline. The rim is full, and the date and main lettering can be read.",
  "Well worn, but the main parts of the design are clear and some inside detail shows.",
  "Even, moderate wear. All the main parts of the design show, with some fine detail.",
  "Light to moderate wear on the highest points. Most of the fine detail is clear.",
  "Light wear only on the highest points. All the detail is sharp.",
  "Just a trace of wear on the very highest points. Much of the mint shine is left.",
  "No wear at all, but there may be many nicks from other coins and dull shine.",
  "No wear. A few small nicks and good shine.",
  "No wear. Only small, scattered nicks and strong shine.",
  "No wear and almost no marks. Beautiful shine.",
  "Flawless. No marks at all, even under a magnifier. Very rare.",
];
// For the in-between grades (F-15, VF-30 …): the main grade below and above it.
function betweenNote(gi) {
  const d = SCALE[gi][1];
  if (gi === 0 || SCALE[gi - 1][1] !== d) return "";
  let lo = gi; while (lo > 0 && SCALE[lo - 1][1] === d) lo--;
  let hi = gi; while (hi < SCALE.length - 1 && SCALE[hi][1] === d) hi++;
  const code = (i) => SCALE[i][0].split(" ")[0];
  return `In between: a little better than ${code(lo)}, not quite ${code(hi)}. The coin has a bit more detail${d >= 9 ? ", fewer marks or better shine" : " left"}.`;
}

async function renderGrade() {

async function onPicked(e) {

/* ---------- spotting pictures already brought in ---------- */
// Pictures match when their contents are identical. Only same-sized files are compared, so this stays quick.
const printCache = new WeakMap();
async function fingerprint(blob) {
  if (printCache.has(blob)) return printCache.get(blob);
  const fp = await makePrint(blob);
  printCache.set(blob, fp);
  return fp;
}
async function makePrint(blob) {
  try {
    if (crypto && crypto.subtle) {
      const h = new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()));
      return blob.size + ":" + [...h].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  return blob.size + ":" + (blob.name || "");
}
async function knownPictures() {
  const used = new Set(coins.flatMap((c) => c.photos || []));
  const bySize = new Map(), prints = new Set();
  for (const p of (await all("photos")) || []) {
    if (!used.has(p.id) || !p.blob) continue;
    if (p.print) prints.add(p.print);
    if (!bySize.has(p.blob.size)) bySize.set(p.blob.size, []);
    bySize.get(p.blob.size).push(p.blob);
  }
  const hashSize = async (size) => {
    for (const b of bySize.get(size) || []) prints.add(await fingerprint(b));
    bySize.delete(size);
  };
  return {
    async has(file) { await hashSize(file.size); return prints.has(await fingerprint(file)); },
    async add(file) { prints.add(await fingerprint(file)); },
  };
}

async function makeCoins() {

  for (let g = 0; g < groups.length; g++) {

// The two devices talk directly over the home Wi-Fi (WebRTC). A free public PeerJS service only
// introduces them using the 6-digit code; coins and photos never pass through it.
// No STUN/TURN servers: only devices on the same network can reach each other.
let syncPeer = null, syncTimer = 0;
function stopSync() { clearTimeout(syncTimer); if (syncPeer) { try { syncPeer.destroy(); } catch (e) {} syncPeer = null; } }
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "peerjs.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
const peerOptions = () => ({ debug: 0, config: { iceServers: [] }, ...(window.COIN_SYNC_SERVER || {}) });
const PEER_PREFIX = "coin-catalog-sync-";
const stamp = (c) => c.updated || c.created || 0;
// Takes the other device's copy of a coin if it is newer than this one. Returns true when it was used.
async function mergeCoin(r) {
  if (!r || !r.id || r.example) return false;
  const mine = await get("coins", r.id);
  if (mine && stamp(mine) >= stamp(r)) return false;
  const keep = r.deleted ? [] : r.photos || [];
  for (const p of (mine && mine.photos) || []) if (!keep.includes(p)) await del("photos", p);
  await put("coins", r, true);
  return true;
}

async function startSync(mode, code) {
  stopSync();
  try { await loadPeerJS(); } catch (e) { setSyncStatus("Sync needs the internet the first time it is used. Connect to Wi-Fi and try again."); return; }
  const fail = (msg) => { stopSync(); setSyncStatus(msg); const b = document.getElementById("s-go"), i = document.getElementById("s-code"); if (b) b.disabled = false; if (i && i.tagName === "INPUT") i.disabled = false; };
  if (mode === "host") {
    code = String(Math.floor(100000 + Math.random() * 900000));
    const peer = syncPeer = new Peer(PEER_PREFIX + code, peerOptions());
    peer.on("open", () => { const el = document.getElementById("s-code"); if (el) el.textContent = code.slice(0, 3) + " " + code.slice(3); setSyncStatus("Waiting for the other device…"); });
    peer.on("connection", (conn) => { setSyncStatus("Connecting…"); runSync(conn); });
    peer.on("error", (e) => {
      if (e.type === "unavailable-id") return startSync("host");
      fail(e.type === "network" || e.type === "server-error" || e.type === "socket-error" ? "Could not get a code. Check that this device is on Wi-Fi with internet, then try again." : "Sync stopped: " + e.type);
    });
  } else {
    const peer = syncPeer = new Peer(peerOptions());
    peer.on("open", () => {
      setSyncStatus("Looking for the other device…");
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      syncTimer = setTimeout(() => fail("Could not reach the other device. Make sure both are on the same Wi-Fi and the code is still showing, then try again."), 25000);
      runSync(conn);
    });
    peer.on("error", (e) => fail(e.type === "peer-unavailable" ? "No device is showing that code. Check the numbers and try again." : e.type === "network" || e.type === "server-error" || e.type === "socket-error" ? "Could not connect. Check that this device is on Wi-Fi with internet, then try again." : "Sync stopped: " + e.type));
  }
}

function runSync(conn) {
  let theirs = null, myDone = false, theirDone = false, sentAck = false, gotAck = false;
  let got = 0, gone = 0, sent = 0, photosIn = 0, photosExpected = 0, keyIn = false;
  const finish = async () => {
    clearTimeout(syncTimer);
    await refresh(); keepStorage();
    const el = document.getElementById("s-code"); if (el && el.tagName !== "INPUT") el.textContent = "✓";
    setSyncStatus(`All done. ${got} new or changed ${got === 1 ? "coin" : "coins"} came in${gone ? `, ${gone} deleted` : ""}, and ${sent} went to the other device.${keyIn ? " The price key came over too." : ""}`);
    const b = document.getElementById("s-cancel"); if (b) b.textContent = "Done";
    setTimeout(stopSync, 1500);
    toast("Sync finished");
  };
  const maybeAck = () => { if (myDone && theirDone && !sentAck) { sentAck = true; conn.send({ t: "ack" }); if (gotAck) finish(); } };
  const summary = async () => ((await all("coins")) || []).filter((c) => !c.example).map((c) => ({ id: c.id, updated: stamp(c) }));
  conn.on("open", async () => {
    clearTimeout(syncTimer);
    setSyncStatus("Connected. Comparing coins…");
    const photos = ((await all("photos")) || []).map((p) => p.id);
    // The Numista price key goes along so it only has to be typed on one of Dad's devices.
    conn.send({ t: "hello", app: "coin-catalog", v: 1, coins: await summary(), photos, nkey: numistaKey(), aprices: savedAlbumPrices() });
  });
  // Handle messages one at a time, in the order they arrive.
  let queue = Promise.resolve();
  conn.on("data", (m) => { queue = queue.then(() => handle(m)).catch(() => setSyncStatus("Something went wrong while syncing. Try again.")); });
  const handle = async (m) => {
    if (!m || typeof m !== "object") return;
    if (m.t === "hello") {
      if (m.app !== "coin-catalog") return;
      theirs = m;
      if (m.nkey && !numistaKey()) { setNumistaKey(m.nkey); keyIn = true; }
      mergeAlbumPrices(m.aprices);
      // Send every coin that is newer here, and the photos the other side is missing.
      const theirTime = new Map(m.coins.map((c) => [c.id, c.updated]));
      const theirPhotos = new Set(m.photos);
      const mine = ((await all("coins")) || []).filter((c) => !c.example && stamp(c) > (theirTime.get(c.id) ?? -1));
      const needPhotos = [...new Set(mine.flatMap((c) => c.deleted ? [] : c.photos || []))].filter((id) => !theirPhotos.has(id));
      conn.send({ t: "plan", coins: mine.length, photos: needPhotos.length });
      for (const id of needPhotos) {
        const p = await get("photos", id); if (!p) continue;
        conn.send({ t: "photo", id: p.id, name: p.name || "", type: p.blob.type || "image/jpeg", data: await p.blob.arrayBuffer() });
      }
      // Coins go after their photos, so a coin never arrives without its pictures.
      conn.send({ t: "coins", list: mine });
      sent = mine.filter((c) => !c.deleted).length;
      conn.send({ t: "done" }); myDone = true; maybeAck();
    } else if (m.t === "plan") {
      photosExpected = m.photos;
      setSyncStatus(m.coins || m.photos ? `Receiving ${m.coins} ${m.coins === 1 ? "coin" : "coins"}…` : "Sending…");
    } else if (m.t === "photo") {
      const blob = new Blob([m.data], { type: m.type });
      await put("photos", { id: m.id, blob, thumb: await makeThumb(blob).catch(() => blob), name: m.name, added: Date.now() });
      photosIn++; setSyncStatus(`Receiving photo ${photosIn} of ${photosExpected}…`);
    } else if (m.t === "coins") {
      for (const r of m.list) if (await mergeCoin(r)) { if (r.deleted) gone++; else got++; }
    } else if (m.t === "done") {
      theirDone = true; maybeAck();
    } else if (m.t === "ack") {
      gotAck = true; if (sentAck) finish();
    }
  };
  conn.on("error", () => setSyncStatus("The connection was lost. Try again."));
  conn.on("close", () => { if (!(sentAck && gotAck)) setSyncStatus("The connection was lost before sync finished. Try again."); });
}

/* ---------- backup ---------- */
const blobToDataURL = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
// kind "sync" also carries the notes about deleted coins and keeps each coin's time stamp.
async function saveBackup(kind) {
  const sync = kind === "sync", word = sync ? "Sync file" : "Backup";
  const st = document.getElementById("b-status");
  st.textContent = `Preparing ${word.toLowerCase()}…`;
  const photos = (await all("photos")) || [];
  const list = sync ? ((await all("coins")) || []).filter((c) => !c.example) : coins.filter((c) => !c.example);
  const out = { app: "coin-catalog", version: 1, kind: sync ? "sync" : "backup", saved: new Date().toISOString(), coins: list, photos: [] };
  if (sync && numistaKey()) out.nkey = numistaKey(); // sync files only, never backups
  if (sync) out.aprices = savedAlbumPrices(); // album top prices, so the other device needn't look them up again
  const needed = new Set(list.flatMap((c) => c.deleted ? [] : c.photos || []));
  for (const p of photos) if (needed.has(p.id)) out.photos.push({ id: p.id, name: p.name, data: await blobToDataURL(p.blob) });
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const name = `coin-${sync ? "sync" : "backup"}-${new Date().toISOString().slice(0, 10)}.json`;
  const n = list.filter((c) => !c.deleted).length;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "Coin backup", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
    st.textContent = `${word} saved as ${name} (${n} ${n === 1 ? "coin" : "coins"}).` + (sync ? " Copy it to the other device and tap Load a sync file there." : "");
  } catch (e) {
    st.textContent = e && e.name === "AbortError" ? `${word} cancelled.` : `The ${word.toLowerCase()} could not be saved here. In the finished app this saves a file you can keep.`;
  }
}
let loadMode = "backup";
document.getElementById("pick-backup").onchange = async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const st = document.getElementById("b-status");
  const mode = loadMode; loadMode = "backup";
  if (mode === "sync") { await loadSyncFile(f, st); e.target.value = ""; return; }
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "coin-catalog") throw new Error("not ours");
    st.textContent = "Loading backup…";
    const have = new Set(coins.map((c) => c.id));
    let added = 0;
    for (const p of data.photos || []) {
      const blob = await (await fetch(p.data)).blob();
      await put("photos", { id: p.id, blob, thumb: await makeThumb(blob), name: p.name || "", added: Date.now() });
    }
    for (const c of data.coins || []) { if (!have.has(c.id)) added++; await put("coins", c); }
    await refresh();
    const n = (data.coins || []).length;
    st.textContent = `Loaded ${n} ${n === 1 ? "coin" : "coins"} (${added} new).`;
    toast("Backup loaded");
  } catch (err) { st.textContent = "That file is not a coin backup. Choose a file whose name starts with “coin-backup”."; }
  e.target.value = "";
};
// A sync file (or a backup) merged in: only coins newer than the ones here are taken, deletions included.
async function loadSyncFile(f, st) {
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "coin-catalog") throw new Error("not ours");
    st.textContent = "Syncing…";
    const keyIn = !!(data.nkey && !numistaKey()); if (keyIn) setNumistaKey(data.nkey);
    mergeAlbumPrices(data.aprices);
    const used = [];
    for (const c of data.coins || []) if (await mergeCoin(c)) used.push(c);
    const want = new Set(used.flatMap((c) => c.deleted ? [] : c.photos || []));
    for (const p of data.photos || []) {
      if (!want.has(p.id) || await get("photos", p.id)) continue;
      const blob = await (await fetch(p.data)).blob();
      await put("photos", { id: p.id, blob, thumb: await makeThumb(blob), name: p.name || "", added: Date.now() });
    }
    await refresh(); keepStorage();
    const n = used.filter((c) => !c.deleted).length, d = used.length - n;
    st.textContent = (n || d ? `Synced. ${n} new or changed ${n === 1 ? "coin" : "coins"} came in${d ? `, ${d} deleted` : ""}.` : "Synced. Nothing new: this device already had everything in that file.") + (keyIn ? " The price key came over too." : "") +
      " To send this device's changes back, tap Save a sync file and load it on the other device.";
    toast("Sync file loaded");
  } catch (err) { st.textContent = "That file is not a coin sync file. Choose a file whose name starts with “coin-sync”."; }
}

/* ---------- zoom viewer ---------- */
let viewerEl = null;
async function openViewer(pid) {
  const u = await photoURL(pid, "full");
  closeViewer();
  viewerEl = document.createElement("div");
  viewerEl.className = "viewer"; viewerEl.setAttribute("role", "dialog"); viewerEl.setAttribute("aria-label", "Zoomed photo");
  viewerEl.innerHTML = `<div class="stage"><img alt="Coin photo, zoomed"></div>
    <div class="tools"><button class="btn" data-z="out" type="button">− Smaller</button><button class="btn" data-z="in" type="button">+ Bigger</button><button class="btn" data-z="close" type="button">Close</button></div>`;
  document.body.appendChild(viewerEl);
  const stage = viewerEl.querySelector(".stage"), img = viewerEl.querySelector("img");
  let s = 1, base = 1, x = 0, y = 0;
  const apply = () => { img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s * base})`; };
  img.onload = () => { base = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight); apply(); };
  img.src = u;
  const zoom = (f) => { s = Math.min(12, Math.max(1, s * f)); if (s === 1) { x = 0; y = 0; } apply(); };
  viewerEl.querySelector('[data-z="in"]').onclick = () => zoom(1.6);
  viewerEl.querySelector('[data-z="out"]').onclick = () => zoom(1 / 1.6);
  viewerEl.querySelector('[data-z="close"]').onclick = closeViewer;
  const pts = new Map(); let lastDist = 0;
  stage.onpointerdown = (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); };
  stage.onpointermove = (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastDist) zoom(d / lastDist); lastDist = d;
    } else if (pts.size === 1 && s > 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); }
  };
  const up = (e) => { pts.delete(e.pointerId); lastDist = 0; };
  stage.onpointerup = up; stage.onpointercancel = up;
  stage.onwheel = (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2); };
  stage.ondblclick = () => zoom(s > 1 ? 1 / s : 3);
  viewerEl.querySelector('[data-z="close"]').focus();
}
function closeViewer() { if (viewerEl) { viewerEl.remove(); viewerEl = null; } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeViewer(); closeSheet(); } });

/* ---------- confirm sheet + toast ---------- */
let sheetEl = null;
function confirmSheet(head, body, okText, onOk) {
  closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "sheet-bg";
  sheetEl.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true"><h2>${esc(head)}</h2><p>${esc(body)}</p>
    <div class="row"><button class="btn" type="button" data-a="no">Keep it</button><button class="btn danger-solid" type="button" data-a="yes">${esc(okText)}</button></div></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.querySelector('[data-a="no"]').onclick = closeSheet;
  sheetEl.querySelector('[data-a="yes"]').onclick = async () => { closeSheet(); await onOk(); };
  sheetEl.querySelector('[data-a="no"]').focus();
}
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
let toastEl = null, toastT = 0;
function toast(msg, ms = 2600) {
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, ms);
}

/* ---------- permanent storage ---------- */
// Ask the browser not to clear the coins when the device runs low on space.
// Chrome grants this on its own (no pop-up), most reliably once the app is installed.
async function keepStorage() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (e) { return null; }
}

/* ---------- start ---------- */
(async () => {
  let seeded = false;
  try { seeded = localStorage.getItem("coin-catalog-seeded") === "1"; } catch (e) {}
  await refresh();
  try {
    const used = new Set(coins.flatMap((c) => c.photos || []));
    for (const p of (await all("photos")) || []) if (!used.has(p.id)) await del("photos", p.id);
  } catch (e) {}
  let exVer = "";
  try { exVer = localStorage.getItem("coin-catalog-examples") || ""; } catch (e) {}
  let exDone = false;
  if (!coins.length && !seeded) {
    exDone = await seedExamples(); await refresh();
    try { localStorage.setItem("coin-catalog-seeded", "1"); } catch (e) {}
  } else if (exVer !== EXAMPLES_VERSION) {
    try { exDone = await upgradeExamples(); await refresh(); } catch (e) {}
  } else exDone = true;
  if (exDone) try { localStorage.setItem("coin-catalog-examples", EXAMPLES_VERSION); } catch (e) {}
  try { history.replaceState({ v: view }, ""); } catch (e) {}
  render();
  keepStorage();
  repairShapes().catch(() => {});
  setTimeout(() => backgroundPrices().catch(() => {}), 3000);
  window.addEventListener("online", () => backgroundPrices().catch(() => {}));
  if ("serviceWorker" in navigator && window.isSecureContext && window.top === window.self) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
})();
