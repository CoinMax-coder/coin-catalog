<title>Dad's Coin Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+SC:wght@600&display=swap">
<style>
/* Layout: one column, coin-album feel. Navy album board, brass accents, big tap targets, 20px base type. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #141a2b;
  --muted: #4a5266;
  --line: #c9cedb;
  --album: #1d2c55;
  --album-ink: #ffffff;
  --brass: #9a6b12;
  --brass-soft: #f4e7c8;
  --danger: #a3241c;
  --danger-soft: #fbe4e1;
  --focus: #2457d6;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mark: "Cormorant SC", Georgia, "Times New Roman", serif;
  --step-0: 1.25rem;
  --step-1: 1.5rem;
  --step-2: 1.9rem;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #1a2136; --ink: #f2f3f7; --muted: #b9bfd0; --line: #39425c;
  --album: #2b3d70; --album-ink: #ffffff; --brass: #e2b65a; --brass-soft: #3a2f17;
  --danger: #ff8a7f; --danger-soft: #3d1c1a; --focus: #8fb0ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #1a2136; --ink: #f2f3f7; --muted: #b9bfd0; --line: #39425c;
  --album: #2b3d70; --album-ink: #ffffff; --brass: #e2b65a; --brass-soft: #3a2f17;
  --danger: #ff8a7f; --danger-soft: #3d1c1a; --focus: #8fb0ff; color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

.bar { background: var(--album); color: var(--album-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
.bar-in { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-height: 76px }
.bar h1 { font-family: var(--font-mark); font-weight: 600; font-size: 2rem; letter-spacing: .02em; margin: 0; flex: 1; min-width: 0; line-height: 1.1 }
@media (max-width: 380px) { .bar h1 { font-size: 1.6rem } }
.bar .back { background: transparent; color: var(--album-ink); border: 2px solid currentColor; border-radius: var(--radius); padding: 8px 16px; min-height: 56px; cursor: pointer; font-weight: 700 }
.bar .icon-btn { background: transparent; color: var(--album-ink); border: 2px solid transparent; border-radius: var(--radius); min-height: 56px; padding: 8px 12px; cursor: pointer; font-weight: 700 }

main { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; display: grid; gap: 20px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 12px 22px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-align: center }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--surface); font-size: var(--step-1) }
:root:not([data-theme="light"]) .btn.primary { color: #1a1406 }
:root[data-theme="light"] .btn.primary { color: #ffffff }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn.primary { color: #ffffff } }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface) }
.btn.wide { width: 100% }
.btn:disabled { opacity: .35; cursor: default }
a.btn { text-decoration: none; color: inherit }
.btn svg { width: 30px; height: 30px; flex: none }
.row { display: flex; flex-wrap: wrap; gap: 12px }
.row > .btn { flex: 1 1 220px }

.search { display: flex; gap: 10px; align-items: center }
.search input { flex: 1; min-width: 0; min-height: 60px; padding: 10px 16px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.count { color: var(--muted); margin: 0 }

.note { background: var(--brass-soft); border: 2px solid var(--brass); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px }
.note p { margin: 0 }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start }
.card:hover { border-color: var(--brass) }
.card .ph { aspect-ratio: 1; max-width: 100%; border-radius: 50%; overflow: hidden; background: var(--bg); display: grid; place-items: center; border: 3px solid var(--line) }
.card .ph img { width: 100%; height: 100%; object-fit: cover }
.card .t { font-weight: 700; font-size: var(--step-0); line-height: 1.25 }
.card .s { color: var(--muted); font-size: 1.1rem }
.tag { display: inline-block; background: var(--brass-soft); color: var(--ink); border: 1px solid var(--brass); border-radius: 999px; padding: 0 10px; font-size: 1rem; font-weight: 700 }

.empty { text-align: center; padding: 30px 10px; color: var(--muted) }

/* detail */
.photo-big { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 12px }
.photo-big .frame { aspect-ratio: 1; max-width: 100%; background: var(--bg); border-radius: 10px; overflow: hidden; display: grid; place-items: center; cursor: zoom-in }
.photo-big .frame img { width: 100%; height: 100%; object-fit: contain }
.seg { display: flex; gap: 8px; flex-wrap: wrap }
.seg button { flex: 1 1 120px; min-height: 56px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--album); color: var(--album-ink); border-color: var(--album) }
dl.facts { margin: 0; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 6px 16px }
dl.facts div { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
dl.facts div:last-child { border-bottom: 0 }
dl.facts dt { color: var(--muted); font-weight: 700 }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap }

.detail { display: grid; gap: 20px; align-items: start }
@media (min-width: 860px) { .detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } }
.detail > * { min-width: 0 }
/* form */
form { display: grid; gap: 18px }
.field { display: grid; gap: 6px }
.field label { font-weight: 700 }
.field .hint { color: var(--muted); font-size: 1.05rem }
.field input, .field select, .field textarea { width: 100%; min-height: 60px; padding: 10px 14px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.field textarea { min-height: 120px; resize: vertical }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 18px }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.slot { background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; text-align: center }
.slot .ph { aspect-ratio: 1; max-width: 100%; border-radius: 50%; overflow: hidden; background: var(--bg); display: grid; place-items: center; color: var(--muted) }
.slot .ph img { width: 100%; height: 100%; object-fit: cover }
.slot .btn { min-height: 56px; padding: 8px 10px; font-size: 1.1rem }

/* import review */
.ask { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px }
.ask p { margin: 0; font-weight: 700 }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 760px) { .rgrid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.rtile { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 8px; display: grid; gap: 8px; align-content: start }
.rtile.front { border-color: var(--album) }
.rtile.back { border-color: var(--brass); border-style: dashed }
.rtile .ph { aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--bg); padding: 0; border: 0; cursor: zoom-in; display: block; width: 100% }
.rtile .ph img { width: 100%; height: 100%; object-fit: cover; display: block }
.rtile .lab { font-weight: 700; text-align: center; line-height: 1.2 }
.rtile .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 1rem }
.arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.arrows button { min-height: 56px; border-radius: var(--radius); border: 2px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 1.6rem; cursor: pointer; line-height: 1 }
.arrows button:disabled { opacity: .3; cursor: default }
.pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.pager .btn { flex: 1 1 140px }
.pager .where { flex: 1 1 100%; text-align: center; color: var(--muted); font-weight: 700; order: -1 }

/* zoom viewer */
.viewer { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: 1fr auto }
.viewer .stage { overflow: hidden; touch-action: none; position: relative }
.viewer .stage img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center; user-select: none; -webkit-user-drag: none }
.viewer .tools { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: #111; flex-wrap: wrap }
.viewer .tools .btn { flex: 1 1 100px; background: #222; color: #fff; border-color: #555 }

/* confirm sheet + toast */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: grid; place-items: end center; padding: 16px }
.sheet { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 20px; width: min(560px, 100%); display: grid; gap: 16px; margin-bottom: env(safe-area-inset-bottom, 0px) }
.sheet h2 { margin: 0; font-size: var(--step-1) }
.sheet p { margin: 0 }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 560px; background: var(--album); color: var(--album-ink); padding: 16px 20px; border-radius: var(--radius); font-weight: 700; z-index: 40; text-align: center }
h2.sec { font-size: var(--step-1); margin: 8px 0 0 }
.help p { margin: 0 0 10px }
.help ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px }
.busy { color: var(--muted); font-weight: 700 }
.btn.choice { font-size: var(--step-0); justify-content: flex-start; text-align: left; gap: 16px; padding: 16px 20px }
.btn.choice svg { width: 40px; height: 40px }
.btn.choice small { font-size: 1.05rem; font-weight: 400 }
.sync-code { font-size: 3.4rem; font-weight: 700; letter-spacing: .12em; text-align: center; background: var(--surface); border: 3px solid var(--brass); border-radius: var(--radius); padding: 18px 10px; font-variant-numeric: tabular-nums }
/* albums */
.albs { display: grid; gap: 12px }
.alb { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: left; cursor: pointer; display: grid; gap: 6px; min-height: 64px }
.alb:hover { border-color: var(--brass) }
.alb-t { font-weight: 700 }
.alb-s { color: var(--muted); font-size: 1.1rem }
.prog { height: 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden }
.prog span { display: block; height: 100%; background: var(--brass) }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 128px), 1fr)); gap: 14px; background: var(--album); padding: 16px; border-radius: var(--radius) }
.slotc { background: transparent; border: 0; color: var(--album-ink); cursor: pointer; display: grid; gap: 6px; justify-items: center; align-content: start; padding: 4px; border-radius: 10px; text-align: center }
.slotc .ring { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(255,255,255,.55); background: rgba(0,0,0,.28); display: grid; place-items: center; overflow: hidden; font-size: 2rem; color: rgba(255,255,255,.7) }
.slotc.has .ring { border: 3px solid var(--brass); background: #000 }
.slotc .ring img { width: 100%; height: 100%; object-fit: cover }
.slotc .lab { font-weight: 700; font-size: 1.1rem; line-height: 1.2 }
.slotc .s { font-size: 1rem; opacity: .85 }
.slotc.focus { outline: 4px solid var(--brass); outline-offset: 2px }
/* judging */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.pair figure { margin: 0; display: grid; gap: 6px; align-content: start }
.pair .frame { aspect-ratio: 1; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; cursor: zoom-in }
.pair .frame img { width: 100%; height: 100%; object-fit: contain; background: #000 }
.pair figcaption { font-weight: 700; font-size: 1.05rem; line-height: 1.3 }
.pair .pcgs-box { cursor: pointer; text-decoration: none; color: var(--ink); background: var(--brass-soft); border-color: var(--brass); display: grid; align-content: center; gap: 8px; padding: 10px; text-align: center }
.pair .pcgs-box strong { font-size: 1.15rem; line-height: 1.25 }
.pair .pcgs-box span { font-size: .95rem; color: var(--muted); line-height: 1.3 }
.busy.pad { padding: 10px; text-align: center; font-size: 1rem; font-weight: 400 }
.gradecard { background: var(--surface); border: 2px solid var(--brass); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px }
.gradecard h2 { margin: 0; font-size: var(--step-2); font-family: var(--font-mark) }
.gradecard p { margin: 0 }
.gradecard .hint, .g-step { color: var(--muted) }
.btn:disabled { opacity: .45; cursor: default }
/* insurance report */
.report { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px }
.rep-head h2 { margin: 0 0 4px; font-size: var(--step-1) }
.rep-head p { margin: 0 }
.rep-tot { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 10px 0 0 }
.rep-tot dt { color: var(--muted); font-size: 1rem }
.rep-tot dd { margin: 0; font-weight: 700; font-size: var(--step-1) }
.rep-item { border-top: 2px solid var(--line); padding-top: 12px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); break-inside: avoid; page-break-inside: avoid }
@media (min-width: 640px) { .rep-item { grid-template-columns: 260px minmax(0, 1fr) } .rep-item.nophoto { grid-template-columns: minmax(0, 1fr) } .rep-item h3 { grid-column: 1 / -1 } }
.rep-item h3 { margin: 0; font-size: var(--step-0) }
.rep-ph { display: flex; gap: 10px }
.rep-ph figure { margin: 0; flex: 1; max-width: 125px; text-align: center; font-size: .95rem; color: var(--muted) }
.rep-ph img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 1px solid var(--line) }
.rep-item dl { margin: 0; display: grid; gap: 2px }
.rep-item dl div { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 10px }
.rep-item dt { color: var(--muted) }
.rep-item dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap }
.rep-foot { color: var(--muted); font-size: 1rem; margin: 0; border-top: 2px solid var(--line); padding-top: 10px }
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] { --bg: #fff; --surface: #fff; --ink: #000; --muted: #444; --line: #bbb; color-scheme: light }
  body { font-size: 12pt }
  .bar, .no-print, .toast, .sheet-bg { display: none !important }
  main { padding: 0; max-width: none }
  .report { border: 0; padding: 0 }
  .rep-item { grid-template-columns: auto minmax(0, 1fr) } .rep-item.nophoto { grid-template-columns: minmax(0, 1fr) } .rep-item h3 { grid-column: 1 / -1 }
  .rep-ph figure { width: 1.2in; flex: none }
}
</style>

<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app" aria-live="polite"></main>
<input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-files" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden>
<input type="file" id="pick-backup" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const DB_NAME = "coin-catalog", DB_VER = 1;
let dbp = null, memory = { coins: new Map(), photos: new Map() };
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((resolve) => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("coins")) db.createObjectStore("coins", { keyPath: "id" });
        if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const db = await openDB();
  if (!db) return fn(null, memory[store]);
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    let out; const r = fn(s);
    if (r && "onsuccess" in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
  });
}
// Every coin change gets a time stamp so sync can tell which copy is newer (sync itself keeps the other device's stamp).
const put = (store, val, keepTime) => {
  if (store === "coins" && !keepTime) val = { ...val, updated: Date.now() };
  return tx(store, "readwrite", (s, m) => m ? m.set(val.id, val) : s.put(val));
};
const get = (store, id) => tx(store, "readonly", (s, m) => m ? m.get(id) : s.get(id));
const del = (store, id) => tx(store, "readwrite", (s, m) => m ? m.delete(id) : s.delete(id));
const all = (store) => tx(store, "readonly", (s, m) => m ? [...m.values()] : s.getAll());

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- photos ---------- */
function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function makeThumb(blob) {
  const { img, url } = await loadImage(blob);
  const size = 360, c = document.createElement("canvas");
  const side = Math.min(img.naturalWidth, img.naturalHeight);
  c.width = c.height = size;
  c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
  URL.revokeObjectURL(url);
  return new Promise((res) => c.toBlob((b) => res(b || blob), "image/jpeg", 0.85));
}
async function savePhoto(file) {
  const id = uid();
  const thumb = await makeThumb(file);
  await put("photos", { id, blob: file, thumb, name: file.name || "", added: Date.now() });
  return id;
}
const urlCache = new Map();
async function photoURL(id, kind = "thumb") {
  const key = id + ":" + kind;
  if (urlCache.has(key)) return urlCache.get(key);
  const p = await get("photos", id);
  if (!p) return "";
  const u = URL.createObjectURL(kind === "thumb" ? p.thumb : p.blob);
  urlCache.set(key, u);
  return u;
}

/* ---------- example coins (drawn, clearly marked) ---------- */
function drawExample(label, sub, metal) {
  const c = document.createElement("canvas"); c.width = c.height = 600;
  const g = c.getContext("2d");
  g.fillStyle = "#20242c"; g.fillRect(0, 0, 600, 600);
  const grad = g.createRadialGradient(240, 220, 40, 300, 300, 270);
  grad.addColorStop(0, metal[0]); grad.addColorStop(1, metal[1]);
  g.fillStyle = grad; g.beginPath(); g.arc(300, 300, 260, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 10; g.beginPath(); g.arc(300, 300, 228, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "rgba(0,0,0,.55)"; g.textAlign = "center";
  g.font = "bold 88px Georgia, serif"; g.fillText(label, 300, 320);
  g.font = "bold 44px Georgia, serif"; g.fillText(sub, 300, 400);
  g.font = "bold 30px Arial"; g.fillText("EXAMPLE", 300, 190);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
}
async function seedExamples() {
  const ex = [
    { country: "United States", year: "1943", denomination: "Lincoln cent", mint: "D", grade: "VF-20 Very Fine", paid: "1.50", notes: "Steel wartime cent. Light spotting on the back.", draw: ["1¢", "1943", ["#eef1f4", "#8d96a3"]] },
    { country: "United States", year: "1921", denomination: "Morgan dollar", mint: "S", grade: "EF-40 Extremely Fine", paid: "38.00", notes: "Bought at the county coin show.", draw: ["$1", "1921", ["#f4f4f4", "#9aa0a8"]] },
    { country: "Canada", year: "1967", denomination: "25 cents", mint: "", grade: "MS-63 Uncirculated", paid: "6.00", notes: "Centennial bobcat design.", draw: ["25¢", "1967", ["#f6f6f2", "#a7a9a3"]] },
  ];
  for (const e of ex) {
    const blob = await drawExample(...e.draw);
    const pid = await savePhoto(blob);
    const { draw, ...fields } = e;
    await put("coins", { id: uid(), created: Date.now(), photos: [pid], example: true, ...fields });
  }
}

/* ---------- built-in catalog: United States series ---------- */
// dates: "1911-1920:P D S" means every year in the range, struck at those mints.

const GROUPS = ["Cents", "Nickels", "Dimes", "Quarters", "Half dollars", "Dollars"];
const seriesById = (id) => SERIES.find((s) => s.id === id) || null;
const normMint = (m) => (!m || /^none/i.test(m) || m === "P") ? "P" : m;

function slotsOf(s) {
  if (s.cache) return s.cache;
  const out = [];
  if (s.states) {
    s.states.forEach((st, i) => {
      for (const m of ["P", "D"]) out.push({ key: st + " " + m, label: st + " " + m, year: String(s.from + Math.floor(i / 5)), mint: m, shown: true, variety: st });
    });
  } else {
    for (const seg of s.dates.split(";")) {
      const [yr, toks] = seg.trim().split(":");
      const [a, b] = yr.split("-").map(Number);
      for (let y = a; y <= (b || a); y++) for (const t of toks.trim().split(/\s+/)) {
        const [m0, v0] = t.split("*");
        const shown = m0.endsWith("!"), mint = m0.replace("!", ""), variety = (v0 || "").replace(/_/g, " ");
        const label = y + (mint !== "P" || shown ? "-" + mint : "") + (variety ? " " + variety : "");
        out.push({ key: label, label, year: String(y), mint, shown, variety });
      }
    }
  }
  for (const sl of out) sl.isKey = s.keys.includes(sl.label);
  return (s.cache = out);
}
// The coin's series: the one it was picked from, else a guess from the coin name and year.
function seriesOf(c) {
  if (c.series) return seriesById(c.series);
  if (c.country && !/^(united states|usa?|u\.s\.?a?\.?|america)$/i.test(c.country.trim())) return null;
  const d = (c.denomination || "").toLowerCase(), y = parseInt(c.year, 10);
  return SERIES.find((s) => s.aliases.some((a) => d.includes(a)) && (!y || (y >= s.from && y <= s.to))) || null;
}
function slotOf(c, s) {
  if (!s) return null;
  const sl = slotsOf(s);
  if (c.slot) { const x = sl.find((z) => z.key === c.slot); if (x) return x; }
  if (s.states) return null;
  const y = String(c.year || "").trim(), m = normMint(c.mint);
  return sl.find((z) => z.year === y && z.mint === m && !z.variety) || sl.find((z) => z.year === y && z.mint === m) || null;
}
// What the edit form fields should say for an album spot.
function fieldsForSlot(s, sl) {
  return { series: s.id, slot: sl.key, year: sl.year, country: "United States",
    mint: sl.mint === "P" && !sl.shown ? "None (Philadelphia)" : sl.mint,
    denomination: s.states ? "State quarter – " + sl.variety : s.den };
}

async function refresh() {
  coins = ((await all("coins")) || []).filter((c) => !c.deleted);
  coins.sort((a, b) => b.created - a.created);
}
function go(next, push = true) {
  view = next;
  if (push) { try { history.pushState({ v: next }, ""); } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", (e) => {
  closeViewer(); closeSheet();
  view = (e.state && e.state.v) || { name: "home" };
  render();
});
function back() { try { if (history.state && history.state.v && view.name !== "home") { history.back(); return; } } catch (e) {} go({ name: "home" }, false); }

/* ---------- albums ---------- */
// Which of Dad's coins sit in which album spot. Example coins stay out of the albums.
function albumFill(s) {
  const map = new Map();
  for (const c of coins) {
    if (c.example || seriesOf(c) !== s) continue;
    const z = slotOf(c, s); if (!z) continue;
    if (!map.has(z.key)) map.set(z.key, []);
    map.get(z.key).push(c);
  }
  return map;
}
const progress = (have, total) => `<div class="prog" role="img" aria-label="${have} of ${total} filled"><span style="width:${total ? Math.round(have / total * 100) : 0}%"></span></div>`;

function renderAlbums() {
  setBar("Albums", true);
  const info = SERIES.map((s) => ({ s, have: albumFill(s).size, total: slotsOf(s).length }));

      <span class="alb-t">${esc(s.name)}</span>

  const started = info.filter((x) => x.have);
  app.innerHTML = `

async function onPicked(e) {

/* ---------- spotting pictures already brought in ---------- */
// Pictures match when their contents are identical. Only same-sized files are compared, so this stays quick.
const printCache = new WeakMap();
async function fingerprint(blob) {
  if (printCache.has(blob)) return printCache.get(blob);
  const fp = await makePrint(blob);
  printCache.set(blob, fp);
  return fp;
}
async function makePrint(blob) {
  try {
    if (crypto && crypto.subtle) {
      const h = new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()));
      return blob.size + ":" + [...h].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  return blob.size + ":" + (blob.name || "");
}
async function knownPictures() {
  const used = new Set(coins.flatMap((c) => c.photos || []));
  const bySize = new Map(), prints = new Set();
  for (const p of (await all("photos")) || []) {
    if (!used.has(p.id) || !p.blob) continue;
    if (!bySize.has(p.blob.size)) bySize.set(p.blob.size, []);
    bySize.get(p.blob.size).push(p.blob);
  }
  const hashSize = async (size) => {
    for (const b of bySize.get(size) || []) prints.add(await fingerprint(b));
    bySize.delete(size);
  };
  return {
    async has(file) { await hashSize(file.size); return prints.has(await fingerprint(file)); },
    async add(file) { prints.add(await fingerprint(file)); },
  };
}

// The two devices talk directly over the home Wi-Fi (WebRTC). A free public PeerJS service only
// introduces them using the 6-digit code; coins and photos never pass through it.
// No STUN/TURN servers: only devices on the same network can reach each other.
let syncPeer = null, syncTimer = 0;
function stopSync() { clearTimeout(syncTimer); if (syncPeer) { try { syncPeer.destroy(); } catch (e) {} syncPeer = null; } }
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "peerjs.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
const peerOptions = () => ({ debug: 0, config: { iceServers: [] }, ...(window.COIN_SYNC_SERVER || {}) });
const PEER_PREFIX = "coin-catalog-sync-";
const stamp = (c) => c.updated || c.created || 0;
// Takes the other device's copy of a coin if it is newer than this one. Returns true when it was used.
async function mergeCoin(r) {
  if (!r || !r.id || r.example) return false;
  const mine = await get("coins", r.id);
  if (mine && stamp(mine) >= stamp(r)) return false;
  const keep = r.deleted ? [] : r.photos || [];
  for (const p of (mine && mine.photos) || []) if (!keep.includes(p)) await del("photos", p);
  await put("coins", r, true);
  return true;
}

  if (st === "host") {
    app.innerHTML = `
      <p>On the other device, tap <strong>Sync phone and computer</strong>, choose <strong>Over Wi-Fi</strong>, then <strong>Type a code</strong> and type:</p>
      <div class="sync-code" id="s-code" aria-live="polite">…</div>
      <p class="busy" id="s-status" aria-live="polite">Getting a code…</p>
      <button class="btn wide" id="s-cancel" type="button">Cancel</button>`;
    document.getElementById("s-cancel").onclick = back;
    startSync("host");
  }
}
function setSyncStatus(t) { const el = document.getElementById("s-status"); if (el) el.textContent = t; }

async function startSync(mode, code) {
  stopSync();
  try { await loadPeerJS(); } catch (e) { setSyncStatus("Sync needs the internet the first time it is used. Connect to Wi-Fi and try again."); return; }
  const fail = (msg) => { stopSync(); setSyncStatus(msg); const b = document.getElementById("s-go"), i = document.getElementById("s-code"); if (b) b.disabled = false; if (i && i.tagName === "INPUT") i.disabled = false; };
  if (mode === "host") {
    code = String(Math.floor(100000 + Math.random() * 900000));
    const peer = syncPeer = new Peer(PEER_PREFIX + code, peerOptions());
    peer.on("open", () => { const el = document.getElementById("s-code"); if (el) el.textContent = code.slice(0, 3) + " " + code.slice(3); setSyncStatus("Waiting for the other device…"); });
    peer.on("connection", (conn) => { setSyncStatus("Connecting…"); runSync(conn); });
    peer.on("error", (e) => {
      if (e.type === "unavailable-id") return startSync("host");
      fail(e.type === "network" || e.type === "server-error" || e.type === "socket-error" ? "Could not get a code. Check that this device is on Wi-Fi with internet, then try again." : "Sync stopped: " + e.type);
    });
  } else {
    const peer = syncPeer = new Peer(peerOptions());
    peer.on("open", () => {
      setSyncStatus("Looking for the other device…");
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      syncTimer = setTimeout(() => fail("Could not reach the other device. Make sure both are on the same Wi-Fi and the code is still showing, then try again."), 25000);
      runSync(conn);
    });
    peer.on("error", (e) => fail(e.type === "peer-unavailable" ? "No device is showing that code. Check the numbers and try again." : e.type === "network" || e.type === "server-error" || e.type === "socket-error" ? "Could not connect. Check that this device is on Wi-Fi with internet, then try again." : "Sync stopped: " + e.type));
  }
}

function runSync(conn) {
  let theirs = null, myDone = false, theirDone = false, sentAck = false, gotAck = false;
  let got = 0, gone = 0, sent = 0, photosIn = 0, photosExpected = 0;
  const finish = async () => {
    clearTimeout(syncTimer);
    await refresh(); keepStorage();
    const el = document.getElementById("s-code"); if (el && el.tagName !== "INPUT") el.textContent = "✓";
    setSyncStatus(`All done. ${got} new or changed ${got === 1 ? "coin" : "coins"} came in${gone ? `, ${gone} deleted` : ""}, and ${sent} went to the other device.`);
    const b = document.getElementById("s-cancel"); if (b) b.textContent = "Done";
    setTimeout(stopSync, 1500);
    toast("Sync finished");
  };
  const maybeAck = () => { if (myDone && theirDone && !sentAck) { sentAck = true; conn.send({ t: "ack" }); if (gotAck) finish(); } };
  const summary = async () => ((await all("coins")) || []).filter((c) => !c.example).map((c) => ({ id: c.id, updated: stamp(c) }));
  conn.on("open", async () => {
    clearTimeout(syncTimer);
    setSyncStatus("Connected. Comparing coins…");
    const photos = ((await all("photos")) || []).map((p) => p.id);
    conn.send({ t: "hello", app: "coin-catalog", v: 1, coins: await summary(), photos });
  });
  // Handle messages one at a time, in the order they arrive.
  let queue = Promise.resolve();
  conn.on("data", (m) => { queue = queue.then(() => handle(m)).catch(() => setSyncStatus("Something went wrong while syncing. Try again.")); });
  const handle = async (m) => {
    if (!m || typeof m !== "object") return;
    if (m.t === "hello") {
      if (m.app !== "coin-catalog") return;
      theirs = m;
      // Send every coin that is newer here, and the photos the other side is missing.
      const theirTime = new Map(m.coins.map((c) => [c.id, c.updated]));
      const theirPhotos = new Set(m.photos);
      const mine = ((await all("coins")) || []).filter((c) => !c.example && stamp(c) > (theirTime.get(c.id) ?? -1));
      const needPhotos = [...new Set(mine.flatMap((c) => c.deleted ? [] : c.photos || []))].filter((id) => !theirPhotos.has(id));
      conn.send({ t: "plan", coins: mine.length, photos: needPhotos.length });
      for (const id of needPhotos) {
        const p = await get("photos", id); if (!p) continue;
        conn.send({ t: "photo", id: p.id, name: p.name || "", type: p.blob.type || "image/jpeg", data: await p.blob.arrayBuffer() });
      }
      // Coins go after their photos, so a coin never arrives without its pictures.
      conn.send({ t: "coins", list: mine });
      sent = mine.filter((c) => !c.deleted).length;
      conn.send({ t: "done" }); myDone = true; maybeAck();
    } else if (m.t === "plan") {
      photosExpected = m.photos;
      setSyncStatus(m.coins || m.photos ? `Receiving ${m.coins} ${m.coins === 1 ? "coin" : "coins"}…` : "Sending…");
    } else if (m.t === "photo") {
      const blob = new Blob([m.data], { type: m.type });
      await put("photos", { id: m.id, blob, thumb: await makeThumb(blob).catch(() => blob), name: m.name, added: Date.now() });
      photosIn++; setSyncStatus(`Receiving photo ${photosIn} of ${photosExpected}…`);
    } else if (m.t === "coins") {
      for (const r of m.list) if (await mergeCoin(r)) { if (r.deleted) gone++; else got++; }
    } else if (m.t === "done") {
      theirDone = true; maybeAck();
    } else if (m.t === "ack") {
      gotAck = true; if (sentAck) finish();
    }
  };
  conn.on("error", () => setSyncStatus("The connection was lost. Try again."));
  conn.on("close", () => { if (!(sentAck && gotAck)) setSyncStatus("The connection was lost before sync finished. Try again."); });
}

/* ---------- backup ---------- */
const blobToDataURL = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
// kind "sync" also carries the notes about deleted coins and keeps each coin's time stamp.
async function saveBackup(kind) {
  const sync = kind === "sync", word = sync ? "Sync file" : "Backup";
  const st = document.getElementById("b-status");
  st.textContent = `Preparing ${word.toLowerCase()}…`;
  const photos = (await all("photos")) || [];
  const list = sync ? ((await all("coins")) || []).filter((c) => !c.example) : coins.filter((c) => !c.example);
  const out = { app: "coin-catalog", version: 1, kind: sync ? "sync" : "backup", saved: new Date().toISOString(), coins: list, photos: [] };
  const needed = new Set(list.flatMap((c) => c.deleted ? [] : c.photos || []));
  for (const p of photos) if (needed.has(p.id)) out.photos.push({ id: p.id, name: p.name, data: await blobToDataURL(p.blob) });
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const name = `coin-${sync ? "sync" : "backup"}-${new Date().toISOString().slice(0, 10)}.json`;
  const n = list.filter((c) => !c.deleted).length;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "Coin backup", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
    st.textContent = `${word} saved as ${name} (${n} ${n === 1 ? "coin" : "coins"}).` + (sync ? " Copy it to the other device and tap Load a sync file there." : "");
  } catch (e) {
    st.textContent = e && e.name === "AbortError" ? `${word} cancelled.` : `The ${word.toLowerCase()} could not be saved here. In the finished app this saves a file you can keep.`;
  }
}
let loadMode = "backup";
document.getElementById("pick-backup").onchange = async (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const st = document.getElementById("b-status");
  const mode = loadMode; loadMode = "backup";
  if (mode === "sync") { await loadSyncFile(f, st); e.target.value = ""; return; }
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "coin-catalog") throw new Error("not ours");
    st.textContent = "Loading backup…";
    const have = new Set(coins.map((c) => c.id));
    let added = 0;
    for (const p of data.photos || []) {
      const blob = await (await fetch(p.data)).blob();
      await put("photos", { id: p.id, blob, thumb: await makeThumb(blob), name: p.name || "", added: Date.now() });
    }
    for (const c of data.coins || []) { if (!have.has(c.id)) added++; await put("coins", c); }
    await refresh();
    const n = (data.coins || []).length;
    st.textContent = `Loaded ${n} ${n === 1 ? "coin" : "coins"} (${added} new).`;
    toast("Backup loaded");
  } catch (err) { st.textContent = "That file is not a coin backup. Choose a file whose name starts with “coin-backup”."; }
  e.target.value = "";
};
// A sync file (or a backup) merged in: only coins newer than the ones here are taken, deletions included.
async function loadSyncFile(f, st) {
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "coin-catalog") throw new Error("not ours");
    st.textContent = "Syncing…";
    const used = [];
    for (const c of data.coins || []) if (await mergeCoin(c)) used.push(c);
    const want = new Set(used.flatMap((c) => c.deleted ? [] : c.photos || []));
    for (const p of data.photos || []) {
      if (!want.has(p.id) || await get("photos", p.id)) continue;
      const blob = await (await fetch(p.data)).blob();
      await put("photos", { id: p.id, blob, thumb: await makeThumb(blob), name: p.name || "", added: Date.now() });
    }
    await refresh(); keepStorage();
    const n = used.filter((c) => !c.deleted).length, d = used.length - n;
    st.textContent = (n || d ? `Synced. ${n} new or changed ${n === 1 ? "coin" : "coins"} came in${d ? `, ${d} deleted` : ""}.` : "Synced. Nothing new: this device already had everything in that file.") +
      " To send this device's changes back, tap Save a sync file and load it on the other device.";
    toast("Sync file loaded");
  } catch (err) { st.textContent = "That file is not a coin sync file. Choose a file whose name starts with “coin-sync”."; }
}

/* ---------- zoom viewer ---------- */
let viewerEl = null;
async function openViewer(pid) {
  const u = await photoURL(pid, "full");
  closeViewer();
  viewerEl = document.createElement("div");
  viewerEl.className = "viewer"; viewerEl.setAttribute("role", "dialog"); viewerEl.setAttribute("aria-label", "Zoomed photo");
  viewerEl.innerHTML = `<div class="stage"><img alt="Coin photo, zoomed"></div>
    <div class="tools"><button class="btn" data-z="out" type="button">− Smaller</button><button class="btn" data-z="in" type="button">+ Bigger</button><button class="btn" data-z="close" type="button">Close</button></div>`;
  document.body.appendChild(viewerEl);
  const stage = viewerEl.querySelector(".stage"), img = viewerEl.querySelector("img");
  let s = 1, base = 1, x = 0, y = 0;
  const apply = () => { img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s * base})`; };
  img.onload = () => { base = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight); apply(); };
  img.src = u;
  const zoom = (f) => { s = Math.min(12, Math.max(1, s * f)); if (s === 1) { x = 0; y = 0; } apply(); };
  viewerEl.querySelector('[data-z="in"]').onclick = () => zoom(1.6);
  viewerEl.querySelector('[data-z="out"]').onclick = () => zoom(1 / 1.6);
  viewerEl.querySelector('[data-z="close"]').onclick = closeViewer;
  const pts = new Map(); let lastDist = 0;
  stage.onpointerdown = (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); };
  stage.onpointermove = (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastDist) zoom(d / lastDist); lastDist = d;
    } else if (pts.size === 1 && s > 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); }
  };
  const up = (e) => { pts.delete(e.pointerId); lastDist = 0; };
  stage.onpointerup = up; stage.onpointercancel = up;
  stage.onwheel = (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2); };
  stage.ondblclick = () => zoom(s > 1 ? 1 / s : 3);
  viewerEl.querySelector('[data-z="close"]').focus();
}
function closeViewer() { if (viewerEl) { viewerEl.remove(); viewerEl = null; } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeViewer(); closeSheet(); } });

/* ---------- confirm sheet + toast ---------- */
let sheetEl = null;
function confirmSheet(head, body, okText, onOk) {
  closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "sheet-bg";
  sheetEl.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true"><h2>${esc(head)}</h2><p>${esc(body)}</p>
    <div class="row"><button class="btn" type="button" data-a="no">Keep it</button><button class="btn danger-solid" type="button" data-a="yes">${esc(okText)}</button></div></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.querySelector('[data-a="no"]').onclick = closeSheet;
  sheetEl.querySelector('[data-a="yes"]').onclick = async () => { closeSheet(); await onOk(); };
  sheetEl.querySelector('[data-a="no"]').focus();
}
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
let toastEl = null, toastT = 0;
function toast(msg, ms = 2600) {
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, ms);
}

/* ---------- permanent storage ---------- */
// Ask the browser not to clear the coins when the device runs low on space.
// Chrome grants this on its own (no pop-up), most reliably once the app is installed.
async function keepStorage() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (e) { return null; }
}

/* ---------- start ---------- */
(async () => {
  let seeded = false;
  try { seeded = localStorage.getItem("coin-catalog-seeded") === "1"; } catch (e) {}
  await refresh();
  try {
    const used = new Set(coins.flatMap((c) => c.photos || []));
    for (const p of (await all("photos")) || []) if (!used.has(p.id)) await del("photos", p.id);
  } catch (e) {}
  if (!coins.length && !seeded) {
    await seedExamples(); await refresh();
    try { localStorage.setItem("coin-catalog-seeded", "1"); } catch (e) {}
  }
  try { history.replaceState({ v: view }, ""); } catch (e) {}
  render();
  keepStorage();
  if ("serviceWorker" in navigator && window.isSecureContext && window.top === window.self) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
})();
</script>
